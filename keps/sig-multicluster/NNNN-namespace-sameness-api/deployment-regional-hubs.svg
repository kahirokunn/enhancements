<svg xmlns="http://www.w3.org/2000/svg" width="960" height="676" viewBox="0 0 960 676" role="img" aria-labelledby="title description">
  <title id="title">Regional hubs</title>
  <desc id="description">Region A contains cluster-a and cluster-b in the blue foo-app group; Region B contains cluster-c and cluster-d in the separate purple foo-app group. Each region has a hub whose inventory namespace stores its group's NamespaceSamenessSlice and both referenced ClusterProfiles. The MCS controllers in cluster-a and cluster-b read hub-a; those in cluster-c and cluster-d read hub-b. No synchronization or merging between hubs is implied. Each Slice references ClusterProfiles on the API server that hosts that Slice. Colored bands enclose the foo-app Namespaces in each group. Green arrows show API reads. NamespaceSameness parents and producers are omitted to focus on placement.</desc>
  <defs>
    <marker id="a-ref" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2869ad"/></marker>
    <marker id="b-ref" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#7750a1"/></marker>
    <marker id="watch-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#23745c"/></marker>
  </defs>
  <rect width="960" height="676" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#243746" stroke-linejoin="round" stroke-linecap="round">
