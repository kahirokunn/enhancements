      <text x="512" y="784" font-size="22" fill="#243746" font-weight="600" text-anchor="start">Region B</text>
      <rect x="48" y="804" width="400" height="254" rx="10" fill="#f7f9fb" stroke="#8595a3" stroke-width="1.5" stroke-dasharray="6 5"/>
      <text x="248" y="834" font-size="22" fill="#243746" font-weight="600" text-anchor="middle">hub-a</text>
