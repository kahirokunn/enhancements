<svg xmlns="http://www.w3.org/2000/svg" width="960" height="800" viewBox="0 0 960 800" role="img" aria-labelledby="title description">
  <title id="title">Resources on member clusters</title>
  <desc id="description">Two member clusters, cluster-a and cluster-b, each store the API resources in a namespace named inventory. Each of those namespaces contains a NamespaceSameness named foo-app, its Slice foo-app-1, and separate ClusterProfile objects representing both cluster-a and cluster-b. Each Slice references the two profiles in its own API. Green arrows show each MCS controller reading its local Slices and ClusterProfiles. The blue band at the bottom encloses foo-app in both member clusters: the two independently published groups describe the same intended relationship. Resource UIDs and references are local to each API; the diagram does not merge groups across API servers. Publication and synchronization are handled by the deployment and are not shown.</desc>
