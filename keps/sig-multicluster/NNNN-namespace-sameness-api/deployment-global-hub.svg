    <path d="M 768 586 V 580 H 796 L 803 586" fill="#ffffff" stroke="#7750a1" stroke-width="1.5"/>
    <rect x="760" y="586" width="116" height="32" rx="5" fill="#ffffff" stroke="#7750a1" stroke-width="1.5"/>
    <text x="818" y="609" font-size="20" fill="#243746" font-weight="400" text-anchor="middle">foo-app</text>
