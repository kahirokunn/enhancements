    <path d="M 640 250 V 264 M 562 277 V 264 H 718 V 277" fill="none" stroke="#7750a1" stroke-width="1.6"/>
    <path d="M 500 282 H 614 L 628 296 V 332 Q 628 336 624 336 H 500 Q 496 336 496 332 V 286 Q 496 282 500 282 Z" fill="#ffffff" stroke="#8595a3" stroke-width="1.5"/>
    <path d="M 614 282 V 296 H 628" fill="none" stroke="#8595a3" stroke-width="1.6"/>
    <text x="562" y="304" font-size="15" fill="#243746" font-weight="600" text-anchor="middle">ClusterProfile</text>
    <text x="562" y="326" font-size="19" fill="#526574" font-weight="400" text-anchor="middle">cluster-c</text>
    <path d="M 656 282 H 770 L 784 296 V 332 Q 784 336 780 336 H 656 Q 652 336 652 332 V 286 Q 652 282 656 282 Z" fill="#ffffff" stroke="#8595a3" stroke-width="1.5"/>
    <path d="M 770 282 V 296 H 784" fill="none" stroke="#8595a3" stroke-width="1.6"/>
    <text x="718" y="304" font-size="15" fill="#243746" font-weight="600" text-anchor="middle">ClusterProfile</text>
    <text x="718" y="326" font-size="19" fill="#526574" font-weight="400" text-anchor="middle">cluster-d</text>
    <path d="M 562 275 V 279" fill="none" stroke="#7750a1" stroke-width="1.6" marker-end="url(#b-ref)"/>
    <path d="M 718 275 V 279" fill="none" stroke="#7750a1" stroke-width="1.6" marker-end="url(#b-ref)"/>
    </g>
