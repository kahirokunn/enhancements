    <rect x="260" y="474" width="188" height="154" rx="9" fill="#f7f9fb" stroke="#8595a3" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="354" y="501" font-size="21" fill="#243746" font-weight="600" text-anchor="middle">cluster-b</text>
    <rect x="272" y="520" width="164" height="36" rx="7" fill="#ffffff" stroke="#23745c" stroke-width="1.5"/>
    <text x="354" y="544" font-size="17" fill="#243746" font-weight="600" text-anchor="middle">MCS controller</text>
    <rect x="68" y="576" width="360" height="48" rx="14" fill="#e7f0fc" stroke="#2869ad" stroke-width="1.5"/>
    <path d="M 92 586 V 580 H 120 L 127 586" fill="#ffffff" stroke="#2869ad" stroke-width="1.5"/>
    <rect x="84" y="586" width="116" height="32" rx="5" fill="#ffffff" stroke="#2869ad" stroke-width="1.5"/>
    <text x="142" y="609" font-size="20" fill="#243746" font-weight="400" text-anchor="middle">foo-app</text>
    <path d="M 304 586 V 580 H 332 L 339 586" fill="#ffffff" stroke="#2869ad" stroke-width="1.5"/>
    <rect x="296" y="586" width="116" height="32" rx="5" fill="#ffffff" stroke="#2869ad" stroke-width="1.5"/>
    <text x="354" y="609" font-size="20" fill="#243746" font-weight="400" text-anchor="middle">foo-app</text>
    <rect x="512" y="474" width="188" height="154" rx="9" fill="#f7f9fb" stroke="#8595a3" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="606" y="501" font-size="21" fill="#243746" font-weight="600" text-anchor="middle">cluster-c</text>
    <rect x="524" y="520" width="164" height="36" rx="7" fill="#ffffff" stroke="#23745c" stroke-width="1.5"/>
    <text x="606" y="544" font-size="17" fill="#243746" font-weight="600" text-anchor="middle">MCS controller</text>
    <rect x="724" y="474" width="188" height="154" rx="9" fill="#f7f9fb" stroke="#8595a3" stroke-width="1.5" stroke-dasharray="6 5"/>
