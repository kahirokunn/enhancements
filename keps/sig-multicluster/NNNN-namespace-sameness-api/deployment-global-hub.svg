    <text x="818" y="544" font-size="17" fill="#243746" font-weight="600" text-anchor="middle">MCS controller</text>
    <rect x="532" y="576" width="360" height="48" rx="14" fill="#f0eafa" stroke="#7750a1" stroke-width="1.5"/>
